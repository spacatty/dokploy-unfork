name: Build Docker Image

on:
  push:
    branches: [canary]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ghcr.io/spacatty/dokploy-unfork:canary -f Dockerfile .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: docker push ghcr.io/spacatty/dokploy-unfork:canary

